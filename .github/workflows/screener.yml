name: Rule One screener

on:
  schedule:
    # Tue-Sat 11:17 UTC: after each US trading day's close, before the next open
    - cron: "17 11 * * 2-6"
  workflow_dispatch:
    inputs:
      tickers:
        description: "Optional comma list to analyze instead of the whole market"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: rule-one-screener
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Settings -> Secrets and variables -> Actions -> Variables: SEC_USER_AGENT="Your Name you@domain.com"
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: .cache
          key: sec-cache-${{ github.run_id }}
          restore-keys: sec-cache-
      - name: Unit tests
        run: python -m pytest -q tests
      - name: Run screen
        run: |
          if [ -n "${{ github.event.inputs.tickers }}" ]; then
            python -m ruleone.screener --tickers "${{ github.event.inputs.tickers }}"
          else
            python -m ruleone.screener
          fi
      - name: Job summary
        run: head -c 60000 lists/latest/README.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit lists
        run: |
          git config user.name "rule-one-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lists
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Screen $(date -u +%F): $(grep -c '' lists/latest/buy_range.csv | awk '{print $1-1}') in buy range"
          git push
