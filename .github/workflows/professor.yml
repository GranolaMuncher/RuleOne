name: Professor (InvestED notes)

# Works through the InvestED podcast in episode order, several runners at a time:
#   plan    -> picks the next episodes and splits them into contiguous shards
#   notes   -> one runner per shard: download + transcribe (faster-whisper, CPU), Claude writes
#              the study notes; only the notes leave the runner (as a short-lived artifact)
#   curate  -> folds all new notes into the course, records progress, commits, redeploys
# Transcripts never leave the runners and are never committed.
on:
  schedule:
    - cron: "41 */3 * * *"   # every 3 hours until the back catalogue is done, then picks up new episodes
  workflow_dispatch:
    inputs:
      count:
        description: "Episodes this run"
        default: "24"
      shards:
        description: "Parallel runners"
        default: "4"

permissions:
  contents: write
  deployments: write

concurrency:
  group: professor
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      ids: ${{ steps.plan.outputs.ids }}
      has_claude: ${{ steps.secrets.outputs.has_claude }}
    steps:
      - uses: actions/checkout@v4
      - id: secrets
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: echo "has_claude=$([ -n "$KEY$OAUTH" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - id: plan
        run: |
          out=$(python -m ruleone.podcast plan --count "${{ github.event.inputs.count || '24' }}" --shards "${{ github.event.inputs.shards || '4' }}")
          echo "$out"
          echo "shards=$(echo "$out" | python -c 'import json,sys; print(json.dumps(json.load(sys.stdin)["shards"]))')" >> "$GITHUB_OUTPUT"
          echo "ids=$(echo "$out" | python -c 'import json,sys; print(json.load(sys.stdin)["ids"])')" >> "$GITHUB_OUTPUT"

  notes:
    needs: plan
    if: needs.plan.outputs.has_claude == 'true' && needs.plan.outputs.shards != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        ids: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - name: Clean Claude credentials
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          for name in KEY OAUTH; do
            clean=$(printf '%s' "${!name}" | tr -d '[:space:]')
            if [ -n "$clean" ]; then
              echo "::add-mask::$clean"
              echo "CLEAN_$name=$clean" >> "$GITHUB_ENV"
            fi
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt faster-whisper
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-en
      - name: Download and transcribe this shard
        run: python -m ruleone.podcast prepare --ids "${{ matrix.ids }}"
      - uses: anthropics/claude-code-action@v1
        if: hashFiles('.work/invested/*.txt') != ''
        continue-on-error: true   # a usage-limit stop still keeps the notes already written
        with:
          anthropic_api_key: ${{ env.CLEAN_KEY }}
          claude_code_oauth_token: ${{ env.CLEAN_OAUTH }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: >-
            Follow agents/professor/PROMPT.md, steps 1 to 3 only (write the episode notes).
            Do NOT edit knowledge/invested/course.json; a later curate step updates the course for the whole run.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 120
            --allowedTools Read,Write,Edit,Glob,Grep
      - name: Collect notes
        run: |
          mkdir -p out
          for id in $(echo "${{ matrix.ids }}" | tr ',' ' '); do
            f="knowledge/invested/episodes/$id.md"
            [ -f "$f" ] && cp "$f" out/ || echo "no notes for $id"
          done
          ls out
      - uses: actions/upload-artifact@v4
        with:
          name: notes-${{ strategy.job-index }}
          path: out/*.md
          retention-days: 2
          if-no-files-found: ignore

  curate:
    needs: [plan, notes]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.ids != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      recorded: ${{ steps.record.outputs.recorded }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          pattern: notes-*
          merge-multiple: true
          path: .work/new-notes
      - id: new
        name: Place new notes
        run: |
          mkdir -p .work/invested
          : > .work/invested/recorded.txt
          for id in $(echo "${{ needs.plan.outputs.ids }}" | tr ',' ' '); do
            if [ -f ".work/new-notes/$id.md" ]; then
              cp ".work/new-notes/$id.md" knowledge/invested/episodes/
              echo "$id" >> .work/invested/recorded.txt
            fi
          done
          # Curate every note not yet in the course (this run's, plus any an earlier curate missed).
          python3 - <<'PY'
          import json, pathlib
          course = json.loads(pathlib.Path("knowledge/invested/course.json").read_text())
          inside = {e for m in course["modules"] for e in m["episodes"]}
          notes = sorted(p.stem for p in pathlib.Path("knowledge/invested/episodes").glob("*.md"))
          pathlib.Path(".work/invested/new.txt").write_text("".join(f"{i}\n" for i in notes if i not in inside))
          PY
          echo "count=$(cat .work/invested/recorded.txt .work/invested/new.txt | wc -l)" >> "$GITHUB_OUTPUT"
          echo "new notes: $(tr '\n' ' ' < .work/invested/recorded.txt)"
          echo "to curate: $(tr '\n' ' ' < .work/invested/new.txt)"
      - name: Clean Claude credentials
        if: steps.new.outputs.count != '0'
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          for name in KEY OAUTH; do
            clean=$(printf '%s' "${!name}" | tr -d '[:space:]')
            if [ -n "$clean" ]; then
              echo "::add-mask::$clean"
              echo "CLEAN_$name=$clean" >> "$GITHUB_ENV"
            fi
          done
      - uses: anthropics/claude-code-action@v1
        if: steps.new.outputs.count != '0'
        continue-on-error: true   # notes still get committed; the course catches up next run
        with:
          anthropic_api_key: ${{ env.CLEAN_KEY }}
          claude_code_oauth_token: ${{ env.CLEAN_OAUTH }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: "Follow the instructions in agents/professor/CURATE.md exactly."
          show_full_output: true   # no transcripts in this job, only public notes, so the log is safe to show
          claude_args: |
            --max-turns 80
            --allowedTools Read,Write,Edit,Glob,Grep,Bash(date:*),Bash(python3:*)
      - uses: actions/setup-python@v5
        if: steps.new.outputs.count != '0'
        with:
          python-version: "3.11"
      - id: record
        name: Record progress and commit notes
        if: steps.new.outputs.count != '0'
        run: |
          pip install -q -r requirements.txt
          out=$(python -m ruleone.podcast record --ids "$(tr '\n' ',' < .work/invested/recorded.txt)"); echo "$out"
          echo "recorded=$(git status --porcelain knowledge | grep -q . && echo true || echo false)" >> "$GITHUB_OUTPUT"
          git config user.name "rule-one-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge
          if git diff --cached --quiet; then echo "no notes"; exit 0; fi
          git commit -m "Professor: InvestED ${out#recorded: }"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  deploy:
    needs: curate
    if: always() && needs.curate.outputs.recorded == 'true'
    uses: ./.github/workflows/deploy-site.yml
    secrets: inherit
