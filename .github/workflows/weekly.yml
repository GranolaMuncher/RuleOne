name: Weekly Rule One run

# Screen every NYSE + Nasdaq stock, optionally have Claude write the weekly scout memo,
# commit the results, then rebuild and deploy the site to Cloudflare Pages.
on:
  schedule:
    - cron: "17 11 * * 6"   # Saturday 11:17 UTC, after Friday's close
  workflow_dispatch:
    inputs:
      tickers:
        description: "Optional comma list to analyze instead of the whole market"
        required: false
        default: ""
      scout:
        description: "Run the Claude scout memo"
        type: boolean
        default: true

permissions:
  contents: write
  deployments: write

concurrency:
  group: rule-one-weekly
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      has_claude: ${{ steps.secrets.outputs.has_claude }}
    env:
      # Settings → Secrets and variables → Actions → Variables: SEC_USER_AGENT="Your Name you@domain.com"
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - id: secrets
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: echo "has_claude=$([ -n "$KEY$OAUTH" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: .cache
          key: sec-cache-${{ github.run_id }}
          restore-keys: sec-cache-
      - name: Unit tests
        run: python -m pytest -q tests
      - name: Run screen
        env:
          TICKERS: ${{ github.event.inputs.tickers }}
        run: |
          if [ -n "$TICKERS" ]; then
            python -m ruleone.screener --tickers "$TICKERS"
          else
            python -m ruleone.screener
          fi
      - name: Job summary
        run: head -c 60000 lists/latest/README.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit lists
        run: |
          git config user.name "rule-one-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lists
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Screen $(date -u +%F): $(($(wc -l < lists/latest/buy_range.csv) - 1)) in buy range"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  scout:
    needs: screen
    if: needs.screen.outputs.has_claude == 'true' && github.event.inputs.tickers == '' && github.event.inputs.scout != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # includes the lists committed by the screen job
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: .cache
          key: sec-cache-${{ github.run_id }}
          restore-keys: sec-cache-
      - name: Clean Claude credentials
        # Tokens copied from a terminal often pick up line breaks where the window wrapped.
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          for name in KEY OAUTH; do
            clean=$(printf '%s' "${!name}" | tr -d '[:space:]')
            if [ -n "$clean" ]; then
              echo "::add-mask::$clean"
              echo "CLEAN_$name=$clean" >> "$GITHUB_ENV"
            fi
          done
      - uses: anthropics/claude-code-action@v1
        with:
          # Set ONE of these repository secrets.
          anthropic_api_key: ${{ env.CLEAN_KEY }}
          claude_code_oauth_token: ${{ env.CLEAN_OAUTH }}
          # Use the workflow's own token; without it the action tries an OIDC exchange
          # for the Claude GitHub App, which fails on schedule/dispatch runs.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: "Follow the instructions in scout/PROMPT.md exactly."
          claude_args: |
            --max-turns 80
            --allowedTools Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch
      - name: Show why Claude stopped
        if: failure()
        run: |
          # The action hides output for security; print only the final result message.
          python3 - <<'EOF'
          import json, pathlib
          p = pathlib.Path("${{ runner.temp }}/claude-execution-output.json")
          if not p.exists():
              print("no execution file"); raise SystemExit
          data = json.loads(p.read_text())
          events = data if isinstance(data, list) else [data]
          for e in events:
              if isinstance(e, dict) and e.get("type") == "result":
                  print("result:", e.get("result") or e.get("errors") or e.get("subtype"))
              if isinstance(e, dict) and e.get("type") == "assistant":
                  for c in (e.get("message") or {}).get("content", []):
                      if c.get("type") == "text":
                          print("assistant:", c["text"][:500])
          EOF
      - name: Commit memo
        run: |
          git config user.name "rule-one-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports ruleone tests
          if git diff --cached --quiet; then echo "no memo produced"; exit 0; fi
          git commit -m "Weekly scout $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  deploy:
    needs: [screen, scout]
    # Runs even when the scout is skipped or fails, as long as the screen succeeded.
    if: always() && needs.screen.result == 'success'
    uses: ./.github/workflows/deploy-site.yml
    secrets: inherit
