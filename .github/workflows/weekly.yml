name: Weekly Rule One run

# Screen every NYSE + Nasdaq stock, have the RULERS analyst update its dossiers and weekly memo,
# commit the results, then rebuild and deploy the site to Cloudflare Pages.
on:
  schedule:
    - cron: "17 11 * * 6"   # Saturday 11:17 UTC, after Friday's close
  workflow_dispatch:
    inputs:
      tickers:
        description: "Optional comma list to analyze instead of the whole market"
        required: false
        default: ""
      rulers:
    needs: screen
    # The RULERS analyst replaces the old scout memo: living dossiers + reports/weekly/<date>_rulers.md
    if: needs.screen.outputs.has_claude == 'true' && github.event.inputs.tickers == '' && github.event.inputs.scout != 'false'
    uses: ./.github/workflows/rulers.yml
    with:
      deploy: false
    secrets: inherit

  editor:
    needs: [screen, rulers]
    # Last word: reconciles screen, Radar and dossiers into the weekly brief, even if RULERS failed.
    if: always() && needs.screen.result == 'success' && needs.screen.outputs.has_claude == 'true' && github.event.inputs.tickers == ''
    uses: ./.github/workflows/editor.yml
    with:
      deploy: false
    secrets: inherit

  deploy:
    needs: [screen, rulers, editor]
    # Runs even when the agents are skipped or fail, as long as the screen succeeded.
    if: always() && needs.screen.result == 'success'
    uses: ./.github/workflows/deploy-site.yml
    secrets: inherit
