name: Radar (daily news and filings)

# Weekdays after the US close: gather filings, headlines, price moves and guru 13F changes for the
# watch list (python), have Claude judge each item EVENT / PROBLEM / WATCH / NOISE against
# knowledge/rule1/METHOD.md, commit research/radar/, then redeploy the site.
on:
  schedule:
    - cron: "22 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    env:
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - id: secrets
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          for name in KEY OAUTH; do
            clean=$(printf '%s' "${!name}" | tr -d '[:space:]')
            if [ -n "$clean" ]; then
              echo "::add-mask::$clean"
              echo "CLEAN_$name=$clean" >> "$GITHUB_ENV"
              echo "has_claude=true" >> "$GITHUB_OUTPUT"
            fi
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: .cache
          key: sec-cache-${{ github.run_id }}
          restore-keys: sec-cache-
      - name: Gather filings, news, prices and 13F moves
        run: python -m ruleone.radar prepare
      - uses: anthropics/claude-code-action@v1
        if: steps.secrets.outputs.has_claude == 'true'
        continue-on-error: true
        with:
          anthropic_api_key: ${{ env.CLEAN_KEY }}
          claude_code_oauth_token: ${{ env.CLEAN_OAUTH }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "github-actions,github-actions[bot]"
          prompt: "Follow the instructions in agents/radar/PROMPT.md exactly."
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 80
            --allowedTools Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(python3:*)
      - id: commit
        name: Record and commit
        run: |
          python -m ruleone.radar record
          git config user.name "rule-one-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/radar lists/latest/gurus.json lists/reference/cusip.csv
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Radar $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: radar
    if: needs.radar.outputs.changed == 'true'
    uses: ./.github/workflows/deploy-site.yml
    secrets: inherit
