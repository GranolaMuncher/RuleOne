name: RULERS analyst

# Weekly living dossiers (Radar, Understand, Love, Event, Reduce basis, Story) for the buy-range
# leaders, fresh Radar events, research/watchlist.txt and stale dossiers. Called by the weekly run
# after the screen; can also be run by hand for specific tickers. The names are split into shards of
# three, each researched by its own Claude job in parallel; a final job merges the dossiers and the memo.
on:
  workflow_call:
    inputs:
      tickers:
        type: string
        default: ""
      deploy:
        type: boolean
        default: false
      limit:
        type: string
        default: "12"
  workflow_dispatch:
    inputs:
      tickers:
        description: "Optional comma list to analyse first (e.g. ADBE,PGR)"
        default: ""
      limit:
        description: "Maximum dossiers this run"
        default: "12"
      deploy:
        description: "Redeploy the site afterwards"
        type: boolean
        default: true

permissions:
  contents: write
  deployments: write

concurrency:
  group: rulers
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      shards: ${{ steps.split.outputs.shards }}
      has_claude: ${{ steps.secrets.outputs.has_claude }}
    env:
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # includes lists committed earlier in the same run
      - id: secrets
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: echo "has_claude=$([ -n "$KEY$OAUTH" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: .cache
          key: sec-cache-${{ github.run_id }}
          restore-keys: sec-cache-
      - name: Pick names and build fact packs
        env:
          TICKERS: ${{ inputs.tickers }}
          LIMIT: ${{ inputs.limit || '12' }}
        run: python -m ruleone.rulers prepare --tickers "$TICKERS" --limit "$LIMIT"
      - id: split
        name: Split into shards of three
        run: |
          echo "shards=$(python -m ruleone.rulers split --size 3)" >> "$GITHUB_OUTPUT"
          mkdir -p rulers-plan && cp -r .work/rulers/inputs.json .work/rulers/shards rulers-plan/
      - uses: actions/upload-artifact@v4
        with:
          name: rulers-plan
          path: rulers-plan/
          retention-days: 3

  dossiers:
    needs: plan
    if: needs.plan.outputs.has_claude == 'true' && needs.plan.outputs.shards != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - id: secrets
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          for name in KEY OAUTH; do
            clean=$(printf '%s' "${!name}" | tr -d '[:space:]')
            if [ -n "$clean" ]; then
              echo "::add-mask::$clean"
              echo "CLEAN_$name=$clean" >> "$GITHUB_ENV"
            fi
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: rulers-plan
          path: rulers-plan
      - name: Load this shard's fact packs
        env:
          SHARD: ${{ matrix.shard }}
        run: mkdir -p .work/rulers && cp "rulers-plan/shards/$SHARD.json" .work/rulers/inputs.json
      - uses: anthropics/claude-code-action@v1
        continue-on-error: true   # dossiers already written are still kept
        with:
          anthropic_api_key: ${{ env.CLEAN_KEY }}
          claude_code_oauth_token: ${{ env.CLEAN_OAUTH }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "github-actions,github-actions[bot]"
          prompt: "Follow the instructions in agents/rulers/PROMPT.md exactly."
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 150
            --allowedTools Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(python3:*)
      - name: Collect this shard's files
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p shard-out/memos
          git status --porcelain --untracked-files=all -- research/rulers reports/config reports/model \
            | sed 's/^...//' | while read -r f; do mkdir -p "shard-out/$(dirname "$f")"; cp "$f" "shard-out/$f"; done
          if [ -f .work/rulers/memo.md ]; then cp .work/rulers/memo.md "shard-out/memos/$SHARD.md"; fi
          find shard-out -type f
      - uses: actions/upload-artifact@v4
        with:
          name: rulers-${{ matrix.shard }}
          path: shard-out/
          if-no-files-found: ignore
          retention-days: 3

  record:
    needs: [plan, dossiers]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: rulers-plan
          path: rulers-plan
      - uses: actions/download-artifact@v4
        with:
          pattern: rulers-s*
          path: shard-out
          merge-multiple: true
      - id: commit
        name: Merge shards, index, write the memo and commit
        run: |
          mkdir -p .work/rulers
          cp rulers-plan/inputs.json .work/rulers/inputs.json
          if [ -d shard-out ]; then
            for d in research reports; do if [ -d "shard-out/$d" ]; then cp -r "shard-out/$d" .; fi; done
            if [ -d shard-out/memos ]; then cp -r shard-out/memos .work/rulers/; fi
          fi
          python -m ruleone.rulers record
          python -m ruleone.rulers memo
          git config user.name "rule-one-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/rulers reports
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "RULERS dossiers $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: record
    if: always() && inputs.deploy && needs.record.outputs.changed == 'true'
    uses: ./.github/workflows/deploy-site.yml
    secrets: inherit
